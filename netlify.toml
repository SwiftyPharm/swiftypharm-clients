[build]
  functions = "netlify/functions"

[build.environment]
  SECRETS_SCAN_OMIT_KEYS = "SUPABASE_URL"

[functions]
  node_bundler = "esbuild"

# ── API et webhooks — avant la règle catch-all ──
[[redirects]]
  from = "/api/stripe-webhook"
  to = "/.netlify/functions/stripe-webhook"
  status = 200
  force = true

[[redirects]]
  from = "/api/supabase-notify"
  to = "/.netlify/functions/supabase-notify"
  status = 200
  force = true

[[redirects]]
  from = "/api/notify-client"
  to = "/.netlify/functions/notify-client"
  status = 200
  force = true

# ── Pages statiques ──
[[redirects]]
  from = "/index.html"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/signup.html"
  to = "/signup.html"
  status = 200

[[redirects]]
  from = "/login.html"
  to = "/login.html"
  status = 200

[[redirects]]
  from = "/backoffice.html"
  to = "/backoffice.html"
  status = 200

[[redirects]]
  from = "/admin.html"
  to = "/admin.html"
  status = 200

[[redirects]]
  from = "/promos.html"
  to = "/promos.html"
  status = 200

[[redirects]]
  from = "/privacy.html"
  to = "/privacy.html"
  status = 200

[[redirects]]
  from = "/terms.html"
  to = "/terms.html"
  status = 200

[[redirects]]
  from = "/"
  to = "/index.html"
  status = 200

# ── Pages pharmacies ──
[[redirects]]
  from = "/*"
  to = "/page.html"
  status = 200
