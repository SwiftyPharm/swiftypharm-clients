  <style>
    :root {
      --blue:#1753ff; --blue-l:#eef2ff; --blue-d:#1040d8;
      --text:#0f172a; --muted:#64748b; --border:#e2e8f0;
      --bg:#f1f5f9; --card:#fff;
      --green:#16a34a; --amber:#d97706; --red:#dc2626;
      --radius:18px; --shadow:0 1px 4px rgba(0,0,0,.06),0 4px 16px rgba(0,0,0,.06);
    }
    * { margin:0; padding:0; box-sizing:border-box; }
    body { font-family:'Inter',sans-serif; background:var(--bg); min-height:100vh; display:flex; flex-direction:column; align-items:center; padding-bottom:120px; }

    /* ── HEADER ── */
    .page-header {
      width:100%; max-width:480px; position:sticky; top:0; z-index:50;
      background:rgba(241,245,249,.92); backdrop-filter:blur(12px);
      padding:16px 16px 12px; display:flex; align-items:center; justify-content:center;
      border-bottom:1px solid var(--border);
    }
    .btn-back {
      position:absolute; left:16px; width:36px; height:36px; border-radius:10px;
      background:var(--card); border:1px solid var(--border); cursor:pointer;
      display:flex; align-items:center; justify-content:center; font-size:16px;
      color:var(--text); text-decoration:none; box-shadow:var(--shadow); transition:all .15s;
    }
    .btn-back:hover { background:var(--blue-l); border-color:var(--blue); }
    .btn-back img { width:16px; height:16px; transform:rotate(180deg); opacity:.75; transition:opacity .2s; }
    .btn-back:hover img { opacity:1; }
    .header-title { font-size:17px; font-weight:800; color:var(--blue); }

    /* ── PANIER FLOATING ── */
    .cart-fab {
      position:fixed; bottom:24px; right:50%; transform:translateX(50%);
      max-width:440px; width:calc(100% - 32px);
      background:#1753FF; color:#fff; border:none; cursor:pointer;
      border-radius:16px; padding:14px 20px;
      display:none; align-items:center; justify-content:space-between;
      box-shadow:0 8px 24px rgba(23,83,255,.4); z-index:100; font-family:inherit;
      transition:all .3s;
    }
    .cart-fab.visible { display:flex; }
    .cart-fab-left { display:flex; align-items:center; gap:10px; }
    .cart-fab-icon { width:22px; height:22px; filter:brightness(0) invert(1); display:block; }
    .cart-fab-label { font-size:14px; font-weight:700; }
    .cart-fab-count { background:rgba(255,255,255,.25); padding:2px 8px; border-radius:20px; font-size:12px; font-weight:700; }
    .cart-fab-total { font-size:16px; font-weight:800; }

    /* ── GRILLE ── */
    .promo-grid {
      width:100%; max-width:480px; display:grid;
      grid-template-columns:1fr 1fr; gap:12px; padding:16px 16px 0;
    }

    /* ── CARD PRODUIT ── */
    /* ── PRODUCT CARD — style Nike ── */
    .product-card {
      background:var(--card); border-radius:20px; overflow:hidden;
      display:flex; flex-direction:column;
      box-shadow:0 2px 12px rgba(0,0,0,.08); transition:transform .2s, box-shadow .2s;
      border:none; position:relative;
    }
    .product-card:hover { transform:translateY(-3px); box-shadow:0 10px 28px rgba(0,0,0,.13); }
    .product-img-wrap {
      position:relative; width:100%; aspect-ratio:1;
      background:#fff; overflow:hidden; cursor:pointer;
      border-radius:20px 20px 0 0;
    }
    .product-img-wrap img { width:100%; height:100%; object-fit:cover; display:block; }
    .product-badge {
      position:absolute; top:10px; left:10px; background:var(--red); color:#fff;
      font-size:9px; font-weight:800; padding:3px 8px; border-radius:20px; letter-spacing:.3px;
    }
    .stock-dot {
      display:inline-flex; align-items:center; gap:4px;
      font-size:10px; font-weight:600;
    }
    .stock-dot::before { content:''; width:6px; height:6px; border-radius:50%; flex-shrink:0; }
    .stock-dot.stock-ok  { color:var(--green); } .stock-dot.stock-ok::before  { background:var(--green); }
    .stock-dot.stock-low { color:var(--amber); } .stock-dot.stock-low::before { background:var(--amber); }
    .stock-dot.stock-out { color:var(--red);   } .stock-dot.stock-out::before { background:var(--red);   }
    .product-info { padding:10px 12px 4px; display:flex; flex-direction:column; gap:2px; flex:1; }
    .product-name { font-size:13px; font-weight:700; color:var(--text); line-height:1.3;
      display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
    .product-brand { font-size:11px; color:#94a3b8; font-weight:500; }
    .product-price-row { display:flex; align-items:baseline; gap:7px; margin-top:5px; }
    .price-after  { font-size:17px; font-weight:800; color:var(--text); }
    .price-before { font-size:11px; color:#b0b0b0; text-decoration:line-through; font-weight:400; }
    .product-footer {
      display:flex; align-items:center; justify-content:space-between;
      padding:6px 12px 12px;
    }
    .btn-add-cart {
      width:40px; height:40px; border-radius:13px;
      background:#1753FF; color:#fff; border:none; cursor:pointer;
      display:flex; align-items:center; justify-content:center;
      transition:all .2s; flex-shrink:0; padding:0;
    }
    .btn-add-cart img { width:20px; height:20px; filter:brightness(0) invert(1); }
    .btn-add-cart:hover:not(:disabled) { background:#0d3fd6; transform:scale(1.08); }
    .btn-add-cart:disabled { background:#e5e5e5; cursor:not-allowed; }
    .btn-add-cart:disabled img { filter:none; opacity:.35; }
    .counter-inline {
      display:none; align-items:center;
      background:#f5f5f5; border-radius:12px; overflow:hidden;
    }
    .counter-inline.show { display:flex; }
    .counter-btn { width:32px; height:32px; background:none; border:none; cursor:pointer;
      font-size:16px; font-weight:700; color:var(--text); display:flex; align-items:center; justify-content:center; transition:background .15s; }
    .counter-btn:hover { background:#e0e0e0; }
    .counter-qty { font-size:13px; font-weight:700; color:var(--text); min-width:24px; text-align:center;
      border-left:1px solid #e0e0e0; border-right:1px solid #e0e0e0; height:32px; display:flex; align-items:center; justify-content:center; }

    /* ── ÉTAT VIDE ── */
    .empty-state { grid-column:1/-1; text-align:center; padding:48px 16px; color:var(--muted); }
    .empty-state .emoji { font-size:48px; margin-bottom:12px; }
    .empty-state p { font-size:15px; line-height:1.6; }

    /* ── MODAL IMAGE ── */
    .img-modal-overlay {
      display:none; position:fixed; inset:0; z-index:9500;
      background:rgba(0,0,0,.88); align-items:flex-start; justify-content:center; padding:20px;
    }
    .img-modal-overlay.open { display:flex; }
    .img-modal-inner { display:flex; flex-direction:column; align-items:center; width:100%; max-width:480px; margin-top:20px; cursor:default; }
    .img-modal-img { width:100%; max-height:52vh; object-fit:cover; border-radius:16px; animation:img-pop .25s cubic-bezier(.25,1,.5,1); }
    @keyframes img-pop { from{transform:scale(.9);opacity:0} to{transform:scale(1);opacity:1} }
    .img-modal-info { background:#fff; width:100%; border-radius:0 0 20px 20px; padding:18px 18px 24px; text-align:center; }
    .img-modal-name { font-size:15px; font-weight:700; color:var(--text); line-height:1.4; margin-bottom:8px; }
    .img-modal-prices { display:flex; align-items:center; justify-content:center; gap:10px; margin-bottom:14px; }
    .img-modal-after  { font-size:22px; font-weight:800; color:var(--blue); }
    .img-modal-before { font-size:13px; color:#94a3b8; text-decoration:line-through; }
    .img-modal-brand { font-size:12px; color:#94a3b8; margin-bottom:10px; }
    .img-modal-add {
      width:100%; padding:13px; border-radius:12px; border:none;
      background:#1753FF; color:#fff; font-family:inherit;
      font-size:14px; font-weight:700; cursor:pointer;
      display:flex; align-items:center; justify-content:center; gap:9px;
      transition:all .2s; margin-top:4px;
    }
    .img-modal-add img { width:19px; height:19px; filter:brightness(0) invert(1); }
    .img-modal-add:hover:not(:disabled) { background:#0d3fd6; transform:translateY(-1px); box-shadow:0 6px 18px rgba(23,83,255,.3); }
    .img-modal-add:disabled { background:#e5e5e5; color:#aaa; cursor:not-allowed; transform:none; box-shadow:none; }
    .img-modal-add:disabled img { filter:none; opacity:.35; }
    .img-modal-add.added { background:var(--green); }
    .img-modal-stock { font-size:11px; font-weight:600; margin-top:9px; }

    .img-modal-close-btn { position:absolute; top:16px; right:16px; background:rgba(255,255,255,.15); border:none; cursor:pointer; font-size:22px; color:#fff; line-height:1; padding:6px 8px; border-radius:8px; }

    /* ── MODAL COMMANDE ── */
    .order-modal-overlay {
      display:none; position:fixed; inset:0; z-index:9000;
      background:rgba(0,0,0,.5); backdrop-filter:blur(4px);
      align-items:flex-end; justify-content:center;
    }
    .order-modal-overlay.open { display:flex; }
    .order-sheet {
      background:#fff; border-radius:24px 24px 0 0; width:100%; max-width:480px;
      padding:0 0 32px; max-height:92vh; overflow-y:auto; -webkit-overflow-scrolling:touch;
      animation:slide-up .3s cubic-bezier(.25,1,.5,1);
    }
    @keyframes slide-up { from{transform:translateY(100%)} to{transform:translateY(0)} }
    .order-handle { width:40px; height:4px; background:#e2e8f0; border-radius:2px; margin:12px auto 0; }
    .order-header { padding:18px 20px 14px; border-bottom:1px solid var(--border); text-align:center; }
    .order-header h3 { font-size:24px; font-weight:800; color:#1753FF; letter-spacing:-.4px; }

    /* Cart items */
    /* ══ PANIER ══ */
    .cart-items { padding:8px 20px 4px; }
    .cart-item {
      display:flex; align-items:center; gap:14px;
      padding:14px 0; border-bottom:1px solid #f1f5f9;
      animation:cart-in .25s ease both;
    }
    .cart-item:last-child { border-bottom:none; }
    @keyframes cart-in { from{opacity:0;transform:translateX(-8px)} to{opacity:1;transform:none} }

    .cart-item-img {
      width:60px; height:60px; border-radius:14px; object-fit:contain;
      background:#f5f5f5; flex-shrink:0; padding:6px;
    }
    .cart-item-info { flex:1; min-width:0; }
    .cart-item-name {
      font-size:14px; font-weight:700; color:var(--text); line-height:1.3;
      overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
    }
    .cart-item-brand { font-size:11px; color:#94a3b8; margin-top:1px; }
    .cart-item-unit { font-size:12px; color:var(--muted); margin-top:4px; }
    .cart-item-unit strong { color:var(--text); font-weight:700; }

    .cart-item-right { display:flex; flex-direction:column; align-items:flex-end; gap:8px; flex-shrink:0; }
    .cart-item-total { font-size:15px; font-weight:800; color:var(--text); }

    /* Stepper quantité dans le panier */
    .qty-stepper {
      display:flex; align-items:center;
      background:#f5f5f5; border-radius:10px; overflow:hidden;
    }
    .qty-stepper button {
      width:30px; height:30px; border:none; background:none; cursor:pointer;
      font-size:16px; font-weight:700; color:var(--text);
      display:flex; align-items:center; justify-content:center;
      transition:background .15s;
    }
    .qty-stepper button:hover:not(:disabled) { background:#e5e5e5; }
    .qty-stepper button:disabled { color:#cbd5e1; cursor:not-allowed; }
    .qty-stepper .qty-val {
      min-width:30px; text-align:center; font-size:13px; font-weight:700;
      color:var(--text); user-select:none;
    }

    .cart-item-remove {
      background:none; border:none; cursor:pointer; padding:3px;
      display:flex; align-items:center; justify-content:center;
      transition:opacity .2s, transform .2s; opacity:.55;
    }
    .cart-item-remove img { width:19px; height:19px; display:block; }
    .cart-item-remove:hover { opacity:1; transform:scale(1.12); }

    .cart-empty { text-align:center; padding:32px 0; color:var(--muted); font-size:14px; }

    /* Ligne "max atteint" */
    .qty-max-hint { font-size:10px; color:var(--amber); font-weight:600; }
    .cart-total-row { display:flex; justify-content:space-between; align-items:center; padding:12px 20px; border-top:2px solid var(--border); font-weight:800; font-size:15px; }

    /* Formulaire commande */
    .order-form { padding:0 20px; }
    .order-form .section-label {
      font-size:11px; font-weight:700; color:var(--muted);
      text-transform:uppercase; letter-spacing:.5px; margin:16px 0 10px;
    }
    .order-form .section-label.big {
      font-size:19px; font-weight:800; color:#1753FF;
      text-transform:none; letter-spacing:-.3px;
      text-align:center; margin:24px 0 16px;
    }
    .order-field { margin-bottom:12px; }
    .order-field label { display:block; font-size:11px; font-weight:600; color:var(--muted); margin-bottom:4px; text-transform:uppercase; letter-spacing:.3px; }
    .order-field input { width:100%; padding:10px 12px; border:1.5px solid var(--border); border-radius:9px; font-family:inherit; font-size:14px; color:var(--text); outline:none; transition:border-color .2s; }
    .order-field input:focus { border-color:var(--blue); }
    .time-row { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
    .order-submit {
      width:100%; padding:14px; border-radius:12px; border:none; cursor:pointer;
      background:#1753FF; color:#fff; font-family:inherit; font-size:15px; font-weight:800;
      margin-top:16px; transition:all .2s; display:flex; align-items:center; justify-content:center; gap:8px;
    }
    .order-submit:hover:not(:disabled) { background:#0d3fd6; transform:translateY(-1px); box-shadow:0 6px 20px rgba(23,83,255,.35); }
    .order-submit:disabled { opacity:.5; cursor:not-allowed; transform:none; box-shadow:none; }
    .order-submit:disabled { opacity:.4; cursor:not-allowed; transform:none; box-shadow:none; }
    .order-cancel { width:100%; padding:12px; border-radius:12px; border:1px solid var(--border); cursor:pointer; background:#fff; font-family:inherit; font-size:14px; font-weight:600; color:var(--muted); margin-top:8px; }

    /* ══ ÉTAPES ══ */
    .order-step { display:none; animation:step-in .28s cubic-bezier(.25,1,.5,1) both; }
    .order-step.active { display:block; }
    @keyframes step-in { from{opacity:0;transform:translateX(14px)} to{opacity:1;transform:none} }

    .step-header { display:flex; align-items:center; gap:10px; text-align:left !important; }
    .step-header h3 { flex:1; text-align:center; }
    .step-back {
      width:34px; height:34px; border-radius:10px; flex-shrink:0;
      border:1px solid var(--border); background:#fff; cursor:pointer;
      display:flex; align-items:center; justify-content:center;
      color:var(--muted); transition:all .18s;
    }
    .step-back svg { width:17px; height:17px; }
    .step-back:hover { border-color:#1753FF; color:#1753FF; background:#f5f8ff; }
    .step-header::after { content:''; width:34px; flex-shrink:0; }

    /* ══ TIME PICKER ══ */
    .tp-summary {
      display:flex; align-items:center; gap:9px;
      background:#f5f8ff; border:1px solid #dbe6ff; border-radius:12px;
      padding:12px 15px; margin-bottom:14px;
      font-size:14px; font-weight:600; color:#1753FF;
      transition:all .2s;
    }
    .tp-summary svg { width:17px; height:17px; flex-shrink:0; }
    .tp-summary.empty { background:#f8fafc; border-color:var(--border); color:var(--muted); font-weight:500; }

    .tp-grid { display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:6px; }
    .tp-col { display:flex; flex-direction:column; min-width:0; }
    .tp-col-label {
      font-size:11px; font-weight:700; color:var(--muted);
      text-transform:uppercase; letter-spacing:.5px;
      margin-bottom:8px; padding-left:2px;
    }
    .tp-scroll {
      height:196px; overflow-y:auto; overscroll-behavior:contain;
      border:1px solid var(--border); border-radius:14px;
      padding:6px; display:flex; flex-direction:column; gap:4px;
      background:#fff; scrollbar-width:thin; scrollbar-color:#d8dee9 transparent;
      -webkit-overflow-scrolling:touch;
    }
    .tp-scroll::-webkit-scrollbar { width:5px; }
    .tp-scroll::-webkit-scrollbar-track { background:transparent; }
    .tp-scroll::-webkit-scrollbar-thumb { background:#d8dee9; border-radius:3px; }
    .tp-scroll::-webkit-scrollbar-thumb:hover { background:#b9c3d2; }

    .tp-slot {
      flex-shrink:0; padding:9px 0; border:none; border-radius:9px;
      background:none; cursor:pointer; font-family:inherit;
      font-size:13.5px; font-weight:600; color:var(--text);
      transition:background .14s, color .14s;
      text-align:center; width:100%;
    }
    .tp-slot:hover:not(:disabled):not(.selected) { background:#f1f5f9; }
    .tp-slot.selected { background:#1753FF; color:#fff; font-weight:700; }
    .tp-slot:disabled { color:#cbd5e1; cursor:not-allowed; }
    .tp-empty { padding:16px 8px; font-size:12px; color:var(--muted); text-align:center; line-height:1.5; }

    /* Succès commande */
    /* ══ CARTE DE CONFIRMATION ══ */
    .order-success { display:none; padding:36px 24px 28px; text-align:center; }

    .confirm-badge {
      width:76px; height:76px; border-radius:50%;
      background:linear-gradient(135deg,var(--blue),#0d8fc4);
      display:flex; align-items:center; justify-content:center;
      margin:0 auto 20px; position:relative;
      box-shadow:0 8px 28px rgba(28,181,224,.35);
      animation:badge-pop .45s cubic-bezier(.34,1.56,.64,1) both;
    }
    @keyframes badge-pop { from{transform:scale(.4);opacity:0} to{transform:scale(1);opacity:1} }
    .confirm-badge::before {
      content:''; position:absolute; inset:-8px; border-radius:50%;
      border:2px solid var(--blue); opacity:.18;
      animation:ring-out 1.6s ease-out infinite;
    }
    @keyframes ring-out {
      0%   { transform:scale(1);    opacity:.3; }
      100% { transform:scale(1.35); opacity:0;  }
    }
    .confirm-badge svg { width:36px; height:36px; stroke:#fff; stroke-width:3.5; fill:none;
      stroke-linecap:round; stroke-linejoin:round; }
    .confirm-badge svg path {
      stroke-dasharray:30; stroke-dashoffset:30;
      animation:check-draw .4s ease .3s forwards;
    }
    @keyframes check-draw { to { stroke-dashoffset:0; } }

    .confirm-title {
      font-size:21px; font-weight:800; color:var(--text);
      letter-spacing:-.3px; margin-bottom:6px;
    }
    .confirm-sub {
      font-size:14px; color:var(--muted); line-height:1.55;
      margin-bottom:26px; max-width:280px; margin-left:auto; margin-right:auto;
    }

    /* Ticket */
    .confirm-ticket {
      background:#fff; border:1px solid #e8f0fb; border-radius:18px;
      padding:4px 20px 20px; text-align:left; position:relative;
      box-shadow:0 2px 16px rgba(0,18,70,.06);
      margin-bottom:22px;
    }
    .ticket-row {
      display:flex; align-items:center; justify-content:space-between;
      padding:15px 0; gap:16px;
      border-bottom:1px dashed #e2e8f0;
    }
    .ticket-row:last-child { border-bottom:none; }
    .ticket-label {
      font-size:12px; color:var(--muted); font-weight:500;
      display:flex; align-items:center; gap:7px; flex-shrink:0;
    }
    .ticket-label svg { width:15px; height:15px; stroke:#94a3b8; stroke-width:2; fill:none;
      stroke-linecap:round; stroke-linejoin:round; }
    .ticket-value {
      font-size:13.5px; font-weight:700; color:var(--text);
      text-align:right; word-break:break-word;
    }

    /* Ligne total mise en avant */
    .ticket-row.total {
      border-top:1px solid #e2e8f0; border-bottom:none;
      margin-top:4px; padding-top:16px;
    }
    .ticket-row.total .ticket-label { font-size:13px; font-weight:700; color:var(--text); }
    .ticket-row.total .ticket-value { font-size:19px; font-weight:800; color:var(--blue); }

    /* Encoches latérales du ticket */
    .confirm-ticket::before,
    .confirm-ticket::after {
      content:''; position:absolute; width:18px; height:18px;
      background:#fff; border:1px solid #e8f0fb; border-radius:50%;
      bottom:66px;
    }
    .confirm-ticket::before { left:-10px;  clip-path:inset(0 0 0 50%); }
    .confirm-ticket::after  { right:-10px; clip-path:inset(0 50% 0 0); }

    .confirm-note {
      font-size:12px; color:var(--muted); line-height:1.6;
      background:#f0f9ff; border:1px solid #bae6fd; border-radius:12px;
      padding:12px 14px; margin-bottom:20px; text-align:left;
    }
    .confirm-note strong { color:#0369a1; }

    /* ── DESKTOP ── */
    @media(min-width:769px){
      html { background:var(--bg); }
      body { max-width:580px; margin:24px auto; border-radius:28px; box-shadow:0 8px 40px rgba(0,0,0,.1); }
    }
  </style>
</head>
<body>

<!-- HEADER -->
<div class="page-header">
  <a class="btn-back" id="btn-back-pharma" href="#"><img id="icon-back" alt="Retour"></a>
  <div class="header-title">Promotions &amp; Nouveautés</div>
</div>

<!-- GRILLE -->
<div class="promo-grid" id="promo-grid"></div>

<!-- PANIER FLOTTANT -->
<button class="cart-fab" id="cart-fab" onclick="openOrderModal()">
  <div class="cart-fab-left">
    <img class="cart-fab-icon" id="fab-icon" alt="">
    <span class="cart-fab-label">Voir mon panier</span>
    <span class="cart-fab-count" id="cart-count">0</span>
  </div>
  <span class="cart-fab-total" id="cart-total">0,00 €</span>
</button>

<!-- MODAL IMAGE -->
<div class="img-modal-overlay" id="img-modal" onclick="closeImgModal()">
  <button class="img-modal-close-btn" onclick="closeImgModal()">✕</button>
  <div class="img-modal-inner" onclick="event.stopPropagation()">
    <img class="img-modal-img" id="img-modal-src" src="" alt="">
    <div class="img-modal-info">
      <div class="img-modal-name" id="img-modal-name"></div>
      <div class="img-modal-brand" id="img-modal-brand"></div>
      <div class="img-modal-prices">
        <span class="img-modal-after" id="img-modal-after"></span>
        <span class="img-modal-before" id="img-modal-before"></span>
      </div>
      <button class="img-modal-add" id="img-modal-add" onclick="addFromModal()">
        <img src="" id="img-modal-add-icon" alt=""> Ajouter au panier
      </button>
      <div class="img-modal-stock" id="img-modal-stock"></div>
    </div>
  </div>
</div>

<!-- MODAL COMMANDE -->
<div class="order-modal-overlay" id="order-modal" onclick="if(event.target===this)closeOrderModal()">
  <div class="order-sheet">
    <div class="order-handle"></div>

    <!-- Contenu panier -->
    <div id="order-content">

      <!-- ══ ÉTAPE 1 — PANIER ══ -->
      <div class="order-step active" id="step-cart">
        <div class="order-header">
          <h3>Mon panier</h3>
        </div>

        <div class="cart-items" id="cart-items-list"></div>

        <div class="cart-total-row">
          <span>Total</span>
          <span id="modal-cart-total">0,00 €</span>
        </div>

        <div class="order-form">
          <button class="order-submit" id="btn-goto-info" onclick="gotoInfoStep()">
            Continuer
          </button>
          <button class="order-cancel" onclick="closeOrderModal()">Continuer mes achats</button>
        </div>
      </div>

      <!-- ══ ÉTAPE 2 — COORDONNÉES ══ -->
      <div class="order-step" id="step-info">
        <div class="order-header step-header">
          <button class="step-back" onclick="gotoCartStep()" title="Retour au panier">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
          </button>
          <h3>Vos coordonnées</h3>
        </div>

        <div class="order-form">
          <div class="time-row">
            <div class="order-field">
              <label>Prénom</label>
              <input type="text" id="order-prenom" placeholder="Jean" autocomplete="given-name">
            </div>
            <div class="order-field">
              <label>Nom</label>
              <input type="text" id="order-nom" placeholder="DUPONT" autocomplete="family-name">
            </div>
          </div>
          <div class="order-field">
            <label>Téléphone</label>
            <input type="tel" id="order-tel" placeholder="06 12 34 56 78" autocomplete="tel">
          </div>

          <!-- ══ TIME PICKER ══ -->
          <div class="section-label big" style="margin-top:26px">Créneau de retrait</div>

          <div class="tp-summary" id="tp-summary">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg>
            <span id="tp-summary-text">Choisissez un créneau</span>
          </div>

          <div class="tp-grid">
            <div class="tp-col">
              <div class="tp-col-label">À partir de</div>
              <div class="tp-scroll" id="tp-start"></div>
            </div>
            <div class="tp-col">
              <div class="tp-col-label">Avant</div>
              <div class="tp-scroll" id="tp-end"></div>
            </div>
          </div>

          <button class="order-submit" id="btn-order-submit" onclick="submitOrder()">
            Confirmer ma commande
          </button>
          <button class="order-cancel" onclick="gotoCartStep()">← Retour au panier</button>
        </div>
      </div>

    </div>

    <!-- Succès -->
    <div class="order-success" id="order-success">
      <div class="confirm-badge">
        <svg viewBox="0 0 24 24"><path d="M4.5 12.5l5 5 10-11"/></svg>
      </div>

      <div class="confirm-title">Commande confirmée</div>
      <div class="confirm-sub">Votre commande a bien été enregistrée. La pharmacie la prépare.</div>

      <div class="confirm-ticket">
        <div class="ticket-row">
          <span class="ticket-label">
            <svg viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
            Nom
          </span>
          <span class="ticket-value" id="cf-nom">—</span>
        </div>

        <div class="ticket-row">
          <span class="ticket-label">
            <svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>
            Date
          </span>
          <span class="ticket-value" id="cf-date">—</span>
        </div>

        <div class="ticket-row">
          <span class="ticket-label">
            <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg>
            Retrait
          </span>
          <span class="ticket-value" id="cf-retrait">—</span>
        </div>

        <div class="ticket-row total">
          <span class="ticket-label">Total</span>
          <span class="ticket-value" id="cf-total">—</span>
        </div>
      </div>

      <div class="confirm-note" id="cf-articles"></div>

      <button class="order-submit" onclick="closeOrderModal()">Terminé</button>
    </div>
  </div>
</div>

const EMAILJS_SERVICE   = 'service_ehw7pcv';
const EMAILJS_TEMPLATE  = 'template_a15fvjn';  // Template Commandes (global)

// Back link
const backBtn = document.getElementById('btn-back-pharma');
if (backBtn && SLUG) backBtn.href = '/' + SLUG;

// ── ÉTAT PANIER ──
let cart = {}; // { productId: { nom, prix, qty, stock, imgSrc } }
let pharmacyData = {};
let promosData = [];

// ── Icônes statiques ──
function initIcons() {
  const back = document.getElementById('icon-back');
  if (back) back.src = ICON_FLECHE;
  const fab = document.getElementById('fab-icon');
  if (fab) fab.src = ICON_PANIER;
}

// ── LOAD ──
async function init() {
  initIcons();
  await loadPharmacy();
  await renderPromos();
}

async function loadPharmacy() {
  try {
    const { data } = await supabaseClient
      .from('pharmacies')
      .select('nom,email_contact,emailjs_template_id,emailjs_template_commandes,emailjs_service_id')
      .eq('slug', SLUG)
      .single();
    if (data) {
      pharmacyData = data;
      document.getElementById('order-pharmacy-name').textContent = data.nom || 'Votre commande click & collect';
    }
  } catch(e) {}
}

function calcDiscount(avant, apres) {
  if (!avant || !apres || avant <= apres) return null;
  return '-' + Math.round((1 - apres / avant) * 100) + '%';
}

async function renderPromos() {
  const grid = document.getElementById('promo-grid');
  try {
    const { data, error } = await supabaseClient.from('promos').select('*').eq('pharmacie_slug', SLUG).order('position', { ascending: true });
    if (error) throw error;
    promosData = (data || []).filter(p => p.actif === true && p.nom && p.nom.trim().length > 0);
  } catch(e) {
    console.error('Erreur promos:', e);
  }

  if (!promosData.length) {
    grid.innerHTML = `<div class="empty-state"><div class="emoji">🏷️</div><p>Aucune promotion disponible<br>pour le moment.<br><br>Revenez bientôt !</p></div>`;
    return;
  }

  grid.innerHTML = promosData.map(p => {
    const stock = parseInt(p.stock) || 0;
    const isOut = stock === 0;
    const isLow = stock > 0 && stock <= 5;
    const stockClass = isOut ? 'stock-out' : isLow ? 'stock-low' : 'stock-ok';
    const stockLabel = isOut ? 'Rupture de stock' : isLow ? `Peu de stock (${stock})` : 'En stock';

    const nom       = p.nom || '';
    const imgSrc    = p.image_url || '';
    const badge     = p.badge || '';
    const prixAvant = parseFloat(p.prix_avant) || 0;
    const prixApres = parseFloat(p.prix_apres) || 0;
    const discount  = calcDiscount(prixAvant, prixApres);

    const badgeHtml = badge    ? `<div class="product-badge">${badge}</div>` : '';
    const avantHtml = prixAvant ? `<span class="price-before">${prixAvant.toFixed(2)} €</span>` : '';
    const apresHtml = prixApres ? `<span class="price-after">${prixApres.toFixed(2)} €</span>` : '';
    const pctHtml   = discount  ? `<span class="discount-pct">${discount}</span>` : '';

    const marque = p.marque || '';

    return `
      <div class="product-card" id="pcard-${p.id}">
        <div class="product-img-wrap" onclick="openImgModal(this)">
          ${imgSrc ? `<img src="${imgSrc}" alt="${nom}" onerror="this.parentElement.style.background='#f5f5f5'">` : '<div style="width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-size:40px;color:#ccc">🧴</div>'}
          ${badgeHtml}
        </div>
        <div class="product-info">
          <div class="product-name">${nom}</div>
          ${marque ? `<div class="product-brand">${marque}</div>` : ''}
          <div class="product-price-row">
            ${apresHtml}
            ${avantHtml}
          </div>
        </div>
        <div class="product-footer">
          <span class="stock-dot ${stockClass}">${stockLabel}</span>
          ${isOut
            ? `<button class="btn-add-cart" disabled title="Rupture de stock"><img src="${ICON_PANIER}" alt=""></button>`
            : `<div style="display:flex;align-items:center">
                <div class="counter-inline" id="counter-${p.id}">
                  <button class="counter-btn" onclick="changeQty('${p.id}',-1)">−</button>
                  <div class="counter-qty" id="qty-${p.id}">1</div>
                  <button class="counter-btn" onclick="changeQty('${p.id}',1)">＋</button>
                </div>
                <button class="btn-add-cart" id="addbtn-${p.id}" onclick="addToCart('${p.id}')" title="Ajouter au panier"><img src="${ICON_PANIER}" alt=""></button>
              </div>`
          }
        </div>
      </div>`;
  }).join('');
}

// ── PANIER ──
function addToCart(id) {
  const p = promosData.find(x => String(x.id) === String(id));
  if (!p || (parseInt(p.stock)||0) === 0) return;

  if (!cart[id]) {
    cart[id] = { nom:p.nom, marque:p.marque||'', prix:parseFloat(p.prix_apres)||0, qty:1, stock:parseInt(p.stock)||0, imgSrc:p.image_url||'' };
  } else {
    if (cart[id].qty >= cart[id].stock) return;
    cart[id].qty++;
  }

  const addbtn = document.getElementById('addbtn-'+id);
  if(addbtn) addbtn.style.display = 'none';
  const counter = document.getElementById('counter-'+id);
  if(counter) counter.classList.add('show');
  document.getElementById('qty-'+id).textContent = cart[id].qty;
  updateCartUI();
}

function changeQty(id, delta) {
  if (!cart[id]) return;
  cart[id].qty += delta;
  if (cart[id].qty <= 0) {
    delete cart[id];
    const _counter = document.getElementById('counter-'+id);
    const _addbtn  = document.getElementById('addbtn-'+id);
    if(_counter) _counter.classList.remove('show');
    if(_addbtn)  _addbtn.style.display = 'flex';
  } else {
    if (cart[id].qty > cart[id].stock) cart[id].qty = cart[id].stock;
    document.getElementById('qty-'+id).textContent = cart[id].qty;
  }
  updateCartUI();
}

function updateCartUI() {
  const items = Object.values(cart);
  const totalQty = items.reduce((s,i) => s + i.qty, 0);
  const totalPrice = items.reduce((s,i) => s + i.qty * i.prix, 0);

  document.getElementById('cart-count').textContent = totalQty;
  document.getElementById('cart-total').textContent = totalPrice.toFixed(2).replace('.',',') + ' €';
  document.getElementById('modal-cart-total').textContent = totalPrice.toFixed(2).replace('.',',') + ' €';

  const fab = document.getElementById('cart-fab');
  fab.classList.toggle('visible', totalQty > 0);
}

// ── MODAL IMAGE ──
let modalProductId = null;

function openImgModal(el) {
  const card = el.closest('.product-card');
  const id = card.id.replace('pcard-', '');
  const p = promosData.find(x => String(x.id) === String(id));
  if (!p) return;

  modalProductId = id;

  document.getElementById('img-modal-src').src = p.image_url || '';
  document.getElementById('img-modal-name').textContent  = p.nom || '';
  document.getElementById('img-modal-brand').textContent = p.marque || '';

  const _av = parseFloat(p.prix_avant) || 0;
  const _ap = parseFloat(p.prix_apres) || 0;
  document.getElementById('img-modal-before').textContent = _av ? _av.toFixed(2).replace('.',',') + ' €' : '';
  document.getElementById('img-modal-after').textContent  = _ap ? _ap.toFixed(2).replace('.',',') + ' €' : '';

  // Bouton ajouter
  const stock  = parseInt(p.stock) || 0;
  const inCart = cart[id] ? cart[id].qty : 0;
  const btn    = document.getElementById('img-modal-add');
  const icon   = document.getElementById('img-modal-add-icon');
  const stockEl= document.getElementById('img-modal-stock');

  icon.src = ICON_PANIER;
  btn.classList.remove('added');

  if (stock === 0) {
    btn.disabled = true;
    btn.innerHTML = 'Rupture de stock';
    stockEl.textContent = '';
  } else if (inCart >= stock) {
    btn.disabled = true;
    btn.innerHTML = 'Stock maximum atteint';
    stockEl.style.color = 'var(--amber)';
    stockEl.textContent = `${inCart} déjà dans votre panier`;
  } else {
    btn.disabled = false;
    btn.innerHTML = `<img src="${ICON_PANIER}" alt=""> Ajouter au panier`;
    stockEl.style.color = stock <= 5 ? 'var(--amber)' : 'var(--green)';
    stockEl.textContent = stock <= 5
      ? `Plus que ${stock} en stock`
      : 'En stock';
  }

  document.getElementById('img-modal').classList.add('open');
  document.body.style.overflow = 'hidden';
}

// Ajouter au panier depuis la modale image
function addFromModal() {
  if (!modalProductId) return;
  addToCart(modalProductId);

  const p      = promosData.find(x => String(x.id) === String(modalProductId));
  const stock  = parseInt(p?.stock) || 0;
  const inCart = cart[modalProductId] ? cart[modalProductId].qty : 0;
  const btn    = document.getElementById('img-modal-add');
  const stockEl= document.getElementById('img-modal-stock');

  btn.classList.add('added');
  btn.innerHTML = '✓ Ajouté au panier';

  stockEl.style.color = 'var(--muted)';
  stockEl.textContent = `${inCart} dans votre panier`;

  setTimeout(() => {
    if (inCart >= stock) {
      btn.disabled = true;
      btn.classList.remove('added');
      btn.innerHTML = 'Stock maximum atteint';
    } else {
      btn.classList.remove('added');
      btn.innerHTML = `<img src="${ICON_PANIER}" alt=""> Ajouter au panier`;
    }
  }, 1100);
}
function closeImgModal() {
  document.getElementById('img-modal').classList.remove('open');
  document.body.style.overflow = '';
}

// ══════════════════════════════════
//  TIME PICKER
// ══════════════════════════════════
const TP_START_HOUR = 8;
const TP_END_HOUR   = 20;
const TP_STEP       = 15;   // minutes

let selectedStart = null;
let selectedEnd   = null;

function tpSlots() {
  const out = [];
  for (let h = TP_START_HOUR; h <= TP_END_HOUR; h++) {
    for (let m = 0; m < 60; m += TP_STEP) {
      if (h === TP_END_HOUR && m > 0) break;
      out.push(String(h).padStart(2,'0') + ':' + String(m).padStart(2,'0'));
    }
  }
  return out;
}

function tpToMin(t) {
  const [h, m] = t.split(':').map(Number);
  return h * 60 + m;
}

function buildTimePicker() {
  const slots    = tpSlots();
  const colStart = document.getElementById('tp-start');
  const colEnd   = document.getElementById('tp-end');

  // Heure de début — à partir de maintenant si on est dans la journée
  const now     = new Date();
  const nowMin  = now.getHours() * 60 + now.getMinutes();

  colStart.innerHTML = slots.map(t => {
    const past = tpToMin(t) < nowMin;
    return `<button class="tp-slot${selectedStart === t ? ' selected' : ''}"
      ${past ? 'disabled' : ''}
      onclick="tpPickStart('${t}')">${t}</button>`;
  }).join('');

  renderEndColumn();
  updateTpSummary();
}

function renderEndColumn() {
  const colEnd = document.getElementById('tp-end');

  if (!selectedStart) {
    colEnd.innerHTML = '<div class="tp-empty">Choisissez d\'abord<br>une heure de début</div>';
    return;
  }

  const startMin = tpToMin(selectedStart);
  const options  = tpSlots().filter(t => tpToMin(t) > startMin);

  if (!options.length) {
    colEnd.innerHTML = '<div class="tp-empty">Aucun créneau<br>disponible</div>';
    return;
  }

  colEnd.innerHTML = options.map(t =>
    `<button class="tp-slot${selectedEnd === t ? ' selected' : ''}"
      onclick="tpPickEnd('${t}')">${t}</button>`
  ).join('');
}

function tpPickStart(t) {
  selectedStart = t;
  // Réinitialiser la fin si elle devient invalide
  if (selectedEnd && tpToMin(selectedEnd) <= tpToMin(t)) selectedEnd = null;

  // Proposer automatiquement +1h
  if (!selectedEnd) {
    const target = tpToMin(t) + 60;
    const match  = tpSlots().find(s => tpToMin(s) === target);
    if (match) selectedEnd = match;
  }

  buildTimePicker();
  scrollToSelected('tp-start');
  scrollToSelected('tp-end');
}

function tpPickEnd(t) {
  selectedEnd = t;
  renderEndColumn();
  updateTpSummary();
}

function scrollToSelected(colId) {
  const col = document.getElementById(colId);
  const sel = col?.querySelector('.tp-slot.selected');
  if (sel) sel.scrollIntoView({ block:'center', behavior:'smooth' });
}

function updateTpSummary() {
  const box  = document.getElementById('tp-summary');
  const text = document.getElementById('tp-summary-text');
  if (selectedStart && selectedEnd) {
    box.classList.remove('empty');
    text.textContent = `Retrait entre ${selectedStart} et ${selectedEnd}`;
  } else if (selectedStart) {
    box.classList.add('empty');
    text.textContent = `À partir de ${selectedStart} — choisissez l'heure de fin`;
  } else {
    box.classList.add('empty');
    text.textContent = 'Choisissez un créneau';
  }
}

// ══════════════════════════════════
//  NAVIGATION ENTRE LES ÉTAPES
// ══════════════════════════════════
function gotoInfoStep() {
  if (!Object.keys(cart).length) { alert('Votre panier est vide.'); return; }
  document.getElementById('step-cart').classList.remove('active');
  document.getElementById('step-info').classList.add('active');
  buildTimePicker();
  document.querySelector('.order-sheet').scrollTop = 0;
}

function gotoCartStep() {
  document.getElementById('step-info').classList.remove('active');
  document.getElementById('step-cart').classList.add('active');
  renderCartItems();
  document.querySelector('.order-sheet').scrollTop = 0;
}

// ── MODAL COMMANDE ──
function openOrderModal() {
  renderCartItems();
  document.getElementById('order-content').style.display = 'block';
  document.getElementById('order-success').style.display = 'none';
  // Toujours démarrer sur l'étape panier
  document.getElementById('step-cart').classList.add('active');
  document.getElementById('step-info').classList.remove('active');
  document.getElementById('order-modal').classList.add('open');
  document.body.style.overflow = 'hidden';
}
function closeOrderModal() {
  document.getElementById('order-modal').classList.remove('open');
  document.body.style.overflow = '';
}

function renderCartItems() {
  const list = document.getElementById('cart-items-list');
  const entries = Object.entries(cart);
  const btnNext = document.getElementById('btn-goto-info');

  if (!entries.length) {
    list.innerHTML = '<div class="cart-empty">Votre panier est vide.</div>';
    document.getElementById('modal-cart-total').textContent = '0,00 €';
    if (btnNext) btnNext.disabled = true;
    return;
  }
  if (btnNext) btnNext.disabled = false;

  list.innerHTML = entries.map(([id, item]) => {
    const atMax = item.qty >= item.stock;
    return `
    <div class="cart-item">
      <img class="cart-item-img" src="${item.imgSrc}" alt="${item.nom}" onerror="this.style.visibility='hidden'">

      <div class="cart-item-info">
        <div class="cart-item-name">${item.nom}</div>
        ${item.marque ? `<div class="cart-item-brand">${item.marque}</div>` : ''}
        <div class="cart-item-unit"><strong>${item.prix.toFixed(2).replace('.',',')} €</strong> / unité</div>
        ${atMax ? '<div class="qty-max-hint">Stock maximum atteint</div>' : ''}
      </div>

      <div class="cart-item-right">
        <div class="cart-item-total">${(item.prix * item.qty).toFixed(2).replace('.',',')} €</div>
        <div class="qty-stepper">
          <button onclick="cartQty('${id}',-1)" ${item.qty <= 1 ? 'disabled' : ''}>−</button>
          <span class="qty-val">${item.qty}</span>
          <button onclick="cartQty('${id}',1)" ${atMax ? 'disabled' : ''}>＋</button>
        </div>
        <button class="cart-item-remove" onclick="removeFromCart('${id}')" title="Retirer">
          <img src="${ICON_POUBELLE}" alt="Retirer">
        </button>
      </div>
    </div>`;
  }).join('');

  const total = Object.values(cart).reduce((s,i) => s + i.qty * i.prix, 0);
  document.getElementById('modal-cart-total').textContent = total.toFixed(2).replace('.',',') + ' €';
}

// ── Modifier la quantité depuis le panier ──
function cartQty(id, delta) {
  const item = cart[id];
  if (!item) return;

  const next = item.qty + delta;
  if (next < 1) return;
  if (next > item.stock) return;

  item.qty = next;

  // Synchroniser le compteur de la carte produit
  const qtyEl = document.getElementById('qty-' + id);
  if (qtyEl) qtyEl.textContent = next;

  updateCartUI();
  renderCartItems();
}

function removeFromCart(id) {
  const item = cart[id];
  if (!item) return;

  // Réinitialiser la carte produit
  const counter = document.getElementById('counter-'+id);
  const addbtn  = document.getElementById('addbtn-'+id);
  if (counter) counter.classList.remove('show');
  if (addbtn)  addbtn.style.display = 'flex';

  delete cart[id];
  updateCartUI();
  renderCartItems();

  // Fermer seulement si le panier est vide
  if (Object.keys(cart).length === 0) {
    setTimeout(closeOrderModal, 250);
  }
}

// ── SOUMETTRE COMMANDE ──
async function submitOrder() {
  if (!Object.keys(cart).length) { alert('Votre panier est vide.'); return; }

  const prenom = document.getElementById('order-prenom').value.trim();
  const nom    = document.getElementById('order-nom').value.trim();
  const tel    = document.getElementById('order-tel').value.trim();
  const debut  = selectedStart;
  const fin    = selectedEnd;

  if (!prenom || !nom || !tel) { alert('Veuillez renseigner vos coordonnées.'); return; }
  if (!debut || !fin)          { alert('Veuillez choisir un créneau de retrait.'); return; }

  const btn = document.getElementById('btn-order-submit');
  btn.disabled = true; btn.textContent = 'Envoi en cours…';

  const articles = Object.values(cart)
      .map(i => `• ${i.nom}${i.marque ? ' (' + i.marque + ')' : ''} × ${i.qty} — ${(i.prix*i.qty).toFixed(2).replace('.', ',')} €`)
      .join('\n');
  const total    = Object.values(cart).reduce((s,i) => s + i.qty * i.prix, 0);
  const now      = new Date().toLocaleString('fr-FR');

  try {
    // 1. Sauvegarder dans Supabase
    await supabaseClient.from('commandes').insert({
      pharmacie_slug: SLUG,
      client_nom: nom, client_prenom: prenom, client_tel: tel,
      heure_debut: debut, heure_fin: fin,
      articles: Object.entries(cart).map(([id,i]) => ({id,nom:i.nom,qty:i.qty,prix:i.prix}))
    });

    // 2. Décrémenter stocks
    for (const [id, item] of Object.entries(cart)) {
      const p = promosData.find(x => String(x.id) === String(id));
      if (p) {
        const newStock = Math.max(0, (parseInt(p.stock)||0) - item.qty);
        await supabaseClient.from('promos').update({ stock: newStock }).eq('id', id);
      }
    }

    // 3. Email pharmacien — non bloquant : la commande reste valide même si l'email échoue
    // Template global par défaut, surchargeable par pharmacie si besoin
    const templateId = pharmacyData.emailjs_template_commandes || EMAILJS_TEMPLATE;
    const serviceId  = pharmacyData.emailjs_service_id || EMAILJS_SERVICE;
    if (templateId && pharmacyData.email_contact) {
      try {
        await emailjs.send(serviceId, templateId, {
          to_email:      pharmacyData.email_contact,
          pharmacy_name: pharmacyData.nom || SLUG,
          client_nom:    `${prenom} ${nom}`,
          client_tel:    tel,
          heure_retrait: `entre ${debut} et ${fin}`,
          articles:      articles,
          total:         total.toFixed(2).replace('.', ',') + ' €',
          commande_at:   now,
        });
      } catch(mailErr) {
        console.warn('Email non envoyé :', mailErr);
      }
    } else {
      console.warn('Email de contact non renseigné pour', SLUG, '— aucun email envoyé.');
    }

    // 4. Remplir la carte de confirmation
    const dateFr = new Date().toLocaleDateString('fr-FR', {
      day:'numeric', month:'long', year:'numeric'
    });
    const nbArticles = Object.values(cart).reduce((s,i) => s + i.qty, 0);
    const listeClient = Object.values(cart)
      .map(i => `${i.qty} × ${i.nom}`)
      .join(' · ');

    document.getElementById('cf-nom').textContent     = `${prenom} ${nom}`;
    document.getElementById('cf-date').textContent    = dateFr;
    document.getElementById('cf-retrait').textContent = `${debut} – ${fin}`;
    document.getElementById('cf-total').textContent   = total.toFixed(2).replace('.', ',') + ' €';
    document.getElementById('cf-articles').innerHTML  =
      `<strong>${nbArticles} article${nbArticles > 1 ? 's' : ''}</strong> — ${listeClient}`;

    document.getElementById('order-content').style.display = 'none';
    document.getElementById('order-success').style.display = 'block';

    // Reset panier et créneau
    cart = {};
    selectedStart = null;
    selectedEnd   = null;
    updateCartUI();
    // Reload promos pour stocks mis à jour
    await renderPromos();

  } catch(e) {
    alert('Erreur lors de l\'envoi. Réessayez.');
    console.error(e);
  }

  btn.disabled = false; btn.textContent = '✓ Confirmer ma commande';
}

init();
</script>
